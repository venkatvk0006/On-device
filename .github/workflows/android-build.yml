
name: Venkat AI APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Venkat AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Verify Project
        working-directory: ./venkat-ai
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          ls -la

      - name: Build Venkat AI APK
        working-directory: ./venkat-ai
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Venkat-AI-APK
          path: venkat-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
